name: Flutter CI - Kost-Kosan App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Code Quality Check (Lint & Format)
  # ─────────────────────────────────────────────
  code_quality:
    name: 🔍 Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (required for Flutter)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4" # Ganti sesuai versi Flutter project kamu
          channel: "stable"
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🎨 Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: 🔎 Run Flutter Analyze (lint)
        run: flutter analyze --no-fatal-infos

  # ─────────────────────────────────────────────
  # JOB 2: Build & Test
  # ─────────────────────────────────────────────
  build_and_test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    needs: code_quality # Hanya jalan kalau code_quality lolos

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0" # Ganti sesuai versi Flutter project kamu
          channel: "stable"
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🧪 Run unit tests
        run: flutter test --coverage

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

      - name: 🏗️ Build APK (debug)
        run: flutter build apk --debug

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kost-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
