# ================================================================
# CI — D'Kost Flutter App
# ================================================================
name: "🔍 CI — Analyze, Test & Build Debug"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.4"
  JAVA_VERSION: "17"

jobs:
  analyze:
    name: "🔎 Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout kode"
        uses: actions/checkout@v4
      - name: "☕ Setup Java ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: "🐦 Setup Flutter ${{ env.FLUTTER_VERSION }}"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - name: "📦 Install dependencies"
        run: flutter pub get
      - name: "🎨 Cek format kode (dart format)"
        run: dart format --output=none --set-exit-if-changed lib/
      - name: "🔎 Flutter Analyze (lint)"
        run: flutter analyze --no-fatal-warnings lib/

  test:
    name: "🧪 Unit & Widget Test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: analyze
    steps:
      - name: "📥 Checkout kode"
        uses: actions/checkout@v4
      - name: "☕ Setup Java ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: "🐦 Setup Flutter ${{ env.FLUTTER_VERSION }}"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - name: "📦 Install dependencies"
        run: flutter pub get
      - name: "🧪 Jalankan tests"
        run: flutter test --coverage --reporter=expanded || echo "No tests found, skipping..."
      - name: "📊 Upload laporan coverage"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/lcov.info
          retention-days: 14

  build_debug:
    name: "🏗️ Build APK Debug"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze
    steps:
      - name: "📥 Checkout kode"
        uses: actions/checkout@v4
      - name: "☕ Setup Java ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: "🐦 Setup Flutter ${{ env.FLUTTER_VERSION }}"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - name: "📦 Install dependencies"
        run: flutter pub get
      - name: "🖼️ Generate splash screen"
        run: dart run flutter_native_splash:create
      - name: "🎯 Generate launcher icons"
        run: dart run flutter_launcher_icons
      - name: "🔐 Decode google-services.json"
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          echo "✅ google-services.json berhasil dibuat"

      - name: "🏗️ Build APK Debug"
        run: flutter build apk --debug --no-pub
      - name: "📤 Upload APK Debug"
        uses: actions/upload-artifact@v4
        with:
          name: dkost-debug-${{ github.run_number }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      - name: "📢 Ringkasan Build"
        if: success()
        run: |
          echo "## ✅ Build Debug Berhasil" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Detail |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter | ${{ env.FLUTTER_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          APK_SIZE=$(du -sh build/app/outputs/flutter-apk/app-debug.apk 2>/dev/null | cut -f1 || echo "N/A")
          echo "| Ukuran APK | \`$APK_SIZE\` |" >> $GITHUB_STEP_SUMMARY